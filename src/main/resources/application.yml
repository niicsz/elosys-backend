spring:
  application:
    name: elosys-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?reWriteBatchedInserts=true&sslmode=${DB_SSLMODE}&sslNegotiation=${DB_SSL_NEGOTIATION}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}
      timeout: 500ms
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

elosys:
  tmp-dir: ${ELOSYS_TMP_DIR}
  reports-dir: ${ELOSYS_REPORTS_DIR}
  admin-token: ${ELOSYS_ADMIN_TOKEN}
  allowed-origins: ${ELOSYS_ALLOWED_ORIGINS}
  cache:
    default-ttl: ${ELOSYS_CACHE_TTL}
    key-prefix: "elosys:v1:"
  download:
    curl-impersonate-path: ${ELOSYS_CURL_IMPERSONATE}
    connect-timeout: 30s
    read-timeout: 300s
  llm:
    api-key: ${ANTHROPIC_API_KEY}
    model: ${ANTHROPIC_MODEL}
    timeout: ${ANTHROPIC_TIMEOUT}
    max-tokens: 1024
  apify:
    token: ${APIFY_TOKEN}
    actor: ${APIFY_ACTOR}
    base-url: https://api.apify.com/v2

resilience:
  bulk-download:
    retry:
      max-attempts: 4
      wait-duration: 5s
      multiplier: 2.0
      jitter: 0.5
    circuitbreaker:
      sliding-window-size: 10
      failure-rate-threshold: 50
      wait-duration-open: 60s
      permitted-calls-half-open: 2
  lookup-api:
    rate-limiter:
      limit-for-period: 2
      limit-refresh-period: 1s
      timeout-duration: 30s
    retry:
      max-attempts: 3
      wait-duration: 1s
      multiplier: 2.0
      jitter: 0.5
    circuitbreaker:
      sliding-window-size: 50
      failure-rate-threshold: 60
      wait-duration-open: 120s
      permitted-calls-half-open: 5
    bulkhead:
      core-size: 4
      max-size: 4
      queue-capacity: 1000
  apify:
    retry:
      max-attempts: 3
      wait-duration: 30s
      multiplier: 1.5
      jitter: 0.3
    circuitbreaker:
      sliding-window-size: 10
      failure-rate-threshold: 50
      wait-duration-open: 300s
      permitted-calls-half-open: 1
  llm:
    timeout: 90s
    retry:
      max-attempts: 3
      wait-duration: 2s
      multiplier: 2.0
      jitter: 0.5
    circuitbreaker:
      sliding-window-size: 20
      failure-rate-threshold: 50
      wait-duration-open: 60s
      permitted-calls-half-open: 3
    bulkhead:
      core-size: 8
      max-size: 8
      queue-capacity: 10000
